openapi: 3.0.3
info:
  title: BPM API
  version: 1.0.0
  description: >-
    API del sistema BPM para gestión de buenas prácticas, identidad y
    operaciones de organizaciones y locales.
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Sistema
    description: Estado y disponibilidad del servicio.
  - name: Identidad
    description: Sesión e identidad verificadas con Firebase.
  - name: Organizaciones
    description: Espacio de trabajo, sedes y equipo con permisos por organización.
  - name: Checklists
    description: Plantillas publicadas y ejecuciones sincronizables por sede.
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verificar que el proceso está vivo
      operationId: getHealth
      responses:
        "200":
          description: Proceso en ejecución.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Sistema]
      summary: Verificar disponibilidad de PostgreSQL
      operationId: getReadiness
      responses:
        "200":
          description: API y PostgreSQL disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/:
    get:
      tags: [Sistema]
      summary: Consultar información básica de la API
      operationId: getAPIInfo
      responses:
        "200":
          description: Nombre y versión desplegada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIInfoResponse"
  /api/v1/auth/activity:
    post:
      tags: [Identidad]
      summary: Registrar actividad explícita de una sesión vigente
      description: >-
        No recibe cuerpo. Comprueba 8 horas desde auth_time y 15 minutos sin
        actividad; una sesión vencida exige autenticación nueva. No llamar
        periódicamente sin interacción del usuario.
      operationId: recordSessionActivity
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Sesión técnica vigente; no concede permisos de empresa.
          headers:
            X-BPM-Session-Expires-At:
              description: Límite absoluto en segundos Unix.
              schema: { type: integer, format: int64 }
            X-BPM-Session-Idle-Expires-At:
              description: Límite de inactividad en segundos Unix.
              schema: { type: integer, format: int64 }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [ACTIVE] }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      tags: [Identidad]
      summary: Revocar el contexto autenticado actual
      description: >-
        No recibe cuerpo. Impide reabrir el mismo UID/auth_time mediante refresh.
        No revoca todas las otras autenticaciones de la cuenta.
      operationId: endCurrentSession
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Contexto revocado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, enum: [SIGNED_OUT] }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me:
    get:
      tags: [Identidad]
      summary: Obtener el perfil del usuario autenticado
      description: >-
        Valida el ID token de Firebase y devuelve el usuario, sus membresías,
        roles y locales activos registrados en PostgreSQL. Comprueba límites de
        sesión sin prolongar actividad; devuelve las dos cabeceras X-BPM-Session.
      operationId: getCurrentProfile
      security:
        - FirebaseBearer: []
      responses:
        "200":
          description: Perfil y membresías activas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Usuario no registrado, inactivo o correo sin verificar (EMAIL_NOT_VERIFIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/register:
    post:
      tags: [Identidad]
      summary: Completar el registro del perfil BPM
      description: >-
        Requiere un ID token Firebase con email verificado. El UID y correo salen
        del token. Crea USER/ACTIVE sin organizaciones; repetir no modifica
        roles, estado ni datos existentes. No acepta contraseñas ni permisos.
      operationId: registerProfile
      security:
        - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Nombre personal con letras Unicode, diacríticos, espacios, apóstrofos o guiones; sin números ni controles.
      responses:
        "200":
          description: Perfil registrado o perfil existente sin modificaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          description: JSON inválido, campos desconocidos o cuerpo demasiado grande.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: EMAIL_NOT_VERIFIED o USER_INACTIVE.
        "409":
          description: REGISTRATION_CONFLICT; nunca fusiona cuentas por email.
        "415":
          description: Se requiere application/json.
        "422":
          description: VALIDATION_ERROR con fields.displayName.
        "429":
          description: Demasiados intentos de registro.
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/organizations:
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar organizaciones activas autorizadas por páginas
      operationId: listOrganizations
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Solo membresías activas; SUPER_ADMIN puede consultar todas. Sin query conserva 100 registros por compatibilidad; con parámetros usa 25 salvo pageSize explícito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceOrganization"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Crear organización (solo SUPER_ADMIN)
      operationId: createOrganization
      description: UUID generado por cliente; repetir el mismo ID y contenido no duplica. Otro contenido devuelve 409. Auditoría transaccional.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceOrganization"}
      responses:
        "200":
          description: Creación o repetición idéntica confirmada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/WorkspaceOrganization"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/workspace:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
      tags: [Organizaciones]
      summary: Consultar espacio de trabajo autorizado
      operationId: getWorkspace
      description: Primera página de cada lista autorizada y cursores independientes. Admite solo pageSize; 25 por defecto con query y 100 sin query por compatibilidad. Totals cuenta todas las sedes permitidas, cursos publicados y controles publicados. WORKER ve solo sus incidencias.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Organización, rol y listas autorizadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/locations:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar sedes autorizadas
      operationId: listLocations
      description: Miembro activo; CHEF y WORKER solo sedes asignadas. Búsqueda por nombre, dirección o distrito.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceLocation"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Crear sede (ADMIN del tenant o SUPER_ADMIN)
      operationId: createLocation
      description: UUID estable entre reintentos idénticos. Zona horaria America/Lima. No acepta actor ni organización en el cuerpo.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceLocation"}
      responses:
        "200":
          description: Sede creada o repetición idéntica.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/WorkspaceLocation"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/check:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    post:
      tags: [Organizaciones]
      summary: Comprobar si una cuenta BPM puede agregarse al equipo
      operationId: checkMemberEligibility
      description: Solo ADMIN de la organización o SUPER_ADMIN, con sesión y correo verificados. Consulta exacta sin mutaciones. No lista usuarios ni revela perfiles o membresías de otras empresas. El correo viaja en JSON, sin parámetros de URL. El alta vuelve a autorizar y validar al confirmar; READY no reserva ni concede acceso.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 320}
      responses:
        "200":
          description: Estado de cuenta disponible, ya incorporada en esta organización o no disponible. No disponible agrupa cuentas inexistentes e inactivas; un perfil BPM se crea tras verificar el correo en identidad.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [READY, ALREADY_MEMBER, UNAVAILABLE]}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members/search:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    post:
      tags: [Organizaciones]
      summary: Sugerir cuentas incorporables mientras se escribe el correo
      operationId: searchMemberAccounts
      description: Solo ADMIN del tenant o SUPER_ADMIN con sesión verificada. Búsqueda dirigida por prefijo literal de correo, mínimo 3 caracteres. Devuelve hasta 5 correos de perfiles BPM activos, excluyendo membresías ya existentes de esta organización. No devuelve nombres, UID, roles ni membresías de otras organizaciones. Para un correo completo añade el estado exacto; una búsqueda parcial sin resultados no afirma inexistencia. Sin escrituras. El alta revalida permisos y pertenencia al confirmar. El cuerpo no se registra ni viaja en la URL; aplica el límite HTTP de solicitudes existente.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: {type: string, minLength: 3, maxLength: 320}
      responses:
        "200":
          description: Hasta cinco sugerencias, ordenadas por correo, y estado exacto opcional. Las cuentas inexistentes e inactivas comparten UNAVAILABLE.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [suggestions, exactStatus]
                    properties:
                      suggestions:
                        type: array
                        maxItems: 5
                        uniqueItems: true
                        items: {type: string, format: email, maxLength: 320}
                      exactStatus: {type: string, nullable: true, enum: [READY, ALREADY_MEMBER, UNAVAILABLE, null]}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/members:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar personas del equipo
      operationId: listMembers
      description: Solo ADMIN del tenant o SUPER_ADMIN. Búsqueda por nombre o correo.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceMember"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Organizaciones]
      summary: Agregar una cuenta BPM activa al equipo
      operationId: addOrganizationMember
      description: Solo ADMIN del tenant o SUPER_ADMIN. No envía invitaciones. No cambia membresías existentes. CHEF/WORKER requieren sedes del mismo tenant. No concede roles de plataforma.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email, maxLength: 320}
                role: {type: string, enum: [ADMIN, CHEF, WORKER]}
                locationIds:
                  type: array
                  maxItems: 100
                  items: {type: string, format: uuid}
      responses:
        "200":
          description: Membresía creada con auditoría.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: {type: string, enum: [ACTIVE]}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklists:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Checklists]
      summary: Descargar catálogo de plantillas publicadas
      operationId: listChecklists
      description: Requiere membresía activa en cada página. Selecciona plantillas completas antes de sus preguntas; nunca divide una plantilla entre páginas. Sin query conserva 100 por compatibilidad. Búsqueda por nombre, área o descripción.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Catálogo del tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/ChecklistTemplate"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Checklists]
      summary: Crear y publicar la primera versión de una plantilla
      operationId: createChecklist
      description: Solo ADMIN o SUPER_ADMIN. UUID de plantilla, versión e ítems generados por cliente. La versión publicada no se edita. Evidencia obligatoria todavía no se acepta.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChecklistTemplate"}
      responses:
        "201":
          description: Plantilla y versión publicadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistTemplate"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/courses:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar cursos publicados
      operationId: listCourses
      description: Miembro activo. Incluye progreso del solicitante. Búsqueda por título o descripción.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceEntry"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-summaries:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar resúmenes de plantillas activas
      operationId: listChecklistSummaries
      description: Miembro activo. Este resumen no sustituye el catálogo publicado con preguntas.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceEntry"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/incidents:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      tags: [Organizaciones]
      summary: Listar incidencias visibles
      operationId: listIncidents
      description: Sedes activas autorizadas mediante consulta directa. WORKER solo sus reportes. Búsqueda por nombre de catálogo o descripción.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Página autorizada. Cursor vacío significa fin; no se devuelve un total de páginas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/WorkspaceEntry"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400": {$ref: "#/components/responses/InvalidPagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklists/{templateID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - in: path
        name: templateID
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Checklists]
      summary: Consultar una plantilla publicada completa
      operationId: getPublishedChecklist
      description: Autoriza el tenant y devuelve la última versión publicada; no depende de la página del catálogo. Sin parámetros de consulta.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Plantilla completa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistTemplate"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-assignments:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      tags: [Checklists]
      summary: Consultar controles programados por sede
      operationId: getChecklistAssignments
      description: Solo programaciones activas. ADMIN/SUPER_ADMIN consultan el tenant; CHEF únicamente sedes asignadas; WORKER no accede. Incluye el período local vigente y su revisión, si existe. Buscar por plantilla o sede. Cada página revalida permisos.
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
      responses:
        "200":
          description: Programaciones autorizadas y estado de revisión del período.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ChecklistAssignment"}}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Checklists]
      summary: Programar una plantilla publicada en una sede
      operationId: createChecklistAssignment
      description: ADMIN/SUPER_ADMIN. Una programación activa por plantilla y sede. El mismo ID y cuerpo confirma el alta previa; reutilizar ID con datos distintos o duplicar una programación activa devuelve 409 RESOURCE_CONFLICT. Sin query. No admite actor ni rol del cliente.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChecklistAssignmentCreate"}
      responses:
        "200":
          description: Programación creada o recuperada. Período y revisión se enriquecen al consultar GET.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChecklistAssignmentEnvelope"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-assignments/{assignmentID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {$ref: "#/components/parameters/ChecklistAssignmentID"}
    get:
      tags: [Checklists]
      summary: Consultar una programación y la revisión vigente
      operationId: getChecklistAssignment
      description: Autoriza tenant y sede, incluso si la programación está inactiva. Mismos roles de consulta de la lista. Sin query ni escrituras.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Programación autorizada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChecklistAssignmentEnvelope"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-assignments/{assignmentID}/deactivate:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {$ref: "#/components/parameters/ChecklistAssignmentID"}
    post:
      tags: [Checklists]
      summary: Dejar de programar revisiones nuevas
      operationId: deactivateChecklistAssignment
      description: ADMIN/SUPER_ADMIN. Idempotente. Conserva revisiones iniciadas e historial; no borra registros ni impide al ejecutor terminar un borrador previo. Sin query.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        "200":
          description: Programación inactiva confirmada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChecklistAssignmentEnvelope"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-runs:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
    get:
      tags: [Checklists]
      summary: Consultar revisiones en curso y finalizadas
      operationId: getChecklistRunHistory
      description: Mis revisiones o supervisión autorizada. CHEF solo consulta sedes asignadas; ADMIN y SUPER_ADMIN supervisan. WORKER no accede al historial. Cada página vuelve a comprobar permisos. Orden por fecha del servidor e ID descendentes.
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/PageSize"}
        - {$ref: "#/components/parameters/PageToken"}
        - {$ref: "#/components/parameters/SearchQuery"}
        - {name: scope, in: query, schema: {type: string, enum: [mine, team], default: mine}}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, SUBMITTED]}}
      responses:
        "200":
          description: Revisiones autorizadas.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ChecklistRunSummary"}}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        default: {$ref: "#/components/responses/WorkspaceError"}
    post:
      tags: [Checklists]
      summary: Iniciar ejecución desde un cliente online u offline
      operationId: createChecklistRun
      description: Solo CHEF con sede activa asignada y versión publicada del mismo tenant. Si existe programación activa exige assignmentId (409 ASSIGNMENT_REQUIRED si se omite); una segunda revisión de la programación en el período devuelve 409 ASSIGNMENT_ALREADY_STARTED. Período determinado por fecha del servidor y zona de la sede; clientCreatedAt no lo modifica. Reintento con mismo ID y contenido recupera la ejecución aun si cambió el período o se detuvo la programación. Sin programación se permite revisión libre.
      security: [{FirebaseBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChecklistRunCreate"}
      responses:
        "200":
          description: Borrador creado o recuperado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistRun"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-runs/{runID}:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {$ref: "#/components/parameters/ChecklistRunID"}
    get:
      tags: [Checklists]
      summary: Consultar ejecución, respuestas y versión
      operationId: getChecklistRun
      description: Autoriza tenant y sede; el ejecutor o un supervisor puede consultar.
      security: [{FirebaseBearer: []}]
      responses:
        "200":
          description: Ejecución actual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistRun"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-runs/{runID}/answers:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {$ref: "#/components/parameters/ChecklistRunID"}
    put:
      tags: [Checklists]
      summary: Reemplazar respuestas de un borrador
      operationId: saveChecklistAnswers
      description: Solo el ejecutor. Requiere rowVersion actual e Idempotency-Key de 8 a 100 caracteres visibles. El mismo cuerpo/clave devuelve la respuesta original; otra versión da 409 VERSION_CONFLICT. No modifica ejecuciones enviadas.
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rowVersion, answers]
              properties:
                rowVersion: {type: integer, minimum: 1}
                answers:
                  type: array
                  maxItems: 100
                  items: {$ref: "#/components/schemas/ChecklistAnswer"}
      responses:
        "200":
          description: Respuestas y nueva versión.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistRun"}
        default: {$ref: "#/components/responses/WorkspaceError"}
  /api/v1/organizations/{organizationID}/checklist-runs/{runID}/submit:
    parameters:
      - {$ref: "#/components/parameters/OrganizationID"}
      - {$ref: "#/components/parameters/ChecklistRunID"}
    post:
      tags: [Checklists]
      summary: Finalizar y puntuar ejecución
      operationId: submitChecklistRun
      description: Solo el ejecutor. Puntaje calculado por servidor; N/A y texto no entran en el denominador. No se puede editar después de enviar.
      security: [{FirebaseBearer: []}]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rowVersion]
              properties:
                rowVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: Ejecución enviada y puntaje.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/ChecklistRun"}
        default: {$ref: "#/components/responses/WorkspaceError"}
components:
  parameters:
    PageSize:
      in: query
      name: pageSize
      description: Tamaño de página. Nuevos endpoints usan 25; endpoints existentes sin query conservan 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageToken:
      in: query
      name: pageToken
      description: Cursor de continuación devuelto por el servidor. Reutilizar con el mismo usuario, tenant, recurso y búsqueda; no concede permisos. Cambiar pageSize está permitido.
      schema: {type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]*$'}
    SearchQuery:
      in: query
      name: query
      description: Subcadena literal sin distinción de mayúsculas. Máximo 160 caracteres, sin controles; no admite comodines SQL.
      schema: {type: string, maxLength: 160}
    OrganizationID:
      in: path
      name: organizationID
      required: true
      description: Se autoriza contra membresía activa; enviar un ID no concede acceso.
      schema: {type: string, maxLength: 64}
    ChecklistAssignmentID:
      in: path
      name: assignmentID
      required: true
      schema: {type: string, format: uuid}
    ChecklistRunID:
      in: path
      name: runID
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 100}
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: ID token emitido por Firebase Authentication.
  responses:
    InvalidPagination:
      description: 400 INVALID_PAGINATION; cursor mal formado, contexto distinto o parámetros inválidos/repetidos/desconocidos. Reiniciar la lista con cursor vacío.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    WorkspaceError:
      description: 400 JSON inválido; 401 sesión inválida; 403 sin permiso/correo sin verificar; 404 cuenta no disponible; 409 conflicto; 415 no JSON; 422 fields inválidos; 429 límite; 500/503 fallo sanitizado.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthenticated:
      description: Token ausente, inválido, vencido o revocado; SESSION_EXPIRED si el contexto BPM venció o fue cerrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Error interno sanitizado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dependencia técnica o autenticación no disponible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Pagination:
      type: object
      required: [nextPageToken]
      properties:
        nextPageToken: {type: string, maxLength: 2048, description: Cadena vacía al terminar la lista.}
    ChecklistItem:
      type: object
      additionalProperties: false
      required: [id, sectionName, label, responseType, displayOrder, required]
      properties:
        id: {type: string, format: uuid}
        sectionName: {type: string, maxLength: 120}
        label: {type: string, maxLength: 300}
        responseType: {type: string, enum: [COMPLIANCE, TEMPERATURE, TEXT, NUMBER]}
        unit: {type: string, maxLength: 20}
        displayOrder: {type: integer, minimum: 1}
        required: {type: boolean}
        minimumValue: {type: number, nullable: true}
        maximumValue: {type: number, nullable: true}
        evidenceRequiredOnFailure: {type: boolean, description: La API todavía no permite true.}
    ChecklistTemplate:
      type: object
      additionalProperties: false
      required: [id, name, area, versionId, items]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 180}
        description: {type: string, maxLength: 500}
        area: {type: string, maxLength: 80}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, readOnly: true}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/ChecklistItem"}
    ChecklistAnswer:
      type: object
      additionalProperties: false
      required: [itemId]
      properties:
        itemId: {type: string, format: uuid}
        complianceResult: {type: string, enum: [COMPLIANT, NON_COMPLIANT, NOT_APPLICABLE]}
        textValue: {type: string, maxLength: 2000}
        observation: {type: string, maxLength: 2000}
        numericValue: {type: number, nullable: true}
    ChecklistAssignmentCreate:
      type: object
      additionalProperties: false
      required: [id, templateId, locationId, frequency]
      properties:
        id: {type: string, format: uuid}
        templateId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        frequency: {type: string, enum: [ONCE, DAILY, WEEKLY, MONTHLY]}
        dueTime: {type: string, pattern: '^(|([01][0-9]|2[0-3]):[0-5][0-9])$', description: "Hora de referencia local opcional. No activa notificaciones ni bloquea el inicio."}
    ChecklistAssignedRun:
      type: object
      additionalProperties: false
      required: [id, status, performedBy, performedByName, createdAt, submittedAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [DRAFT, SUBMITTED]}
        performedBy: {type: string, maxLength: 128}
        performedByName: {type: string, maxLength: 200}
        createdAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time, nullable: true}
    ChecklistAssignment:
      type: object
      additionalProperties: false
      required: [id, templateId, templateName, templateVersionId, locationId, locationName, frequency, dueTime, timezone, active, createdAt, periodStartsAt, periodEndsAt, run]
      properties:
        id: {type: string, format: uuid}
        templateId: {type: string, format: uuid}
        templateName: {type: string, maxLength: 180}
        templateVersionId: {type: string, format: uuid, description: Última versión publicada; cada revisión iniciada conserva su versión inmutable.}
        locationId: {type: string, format: uuid}
        locationName: {type: string, maxLength: 160}
        frequency: {type: string, enum: [ONCE, DAILY, WEEKLY, MONTHLY]}
        dueTime: {type: string, description: "Hora local HH:MM o cadena vacía."}
        timezone: {type: string, description: Zona IANA de la sede.}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        periodStartsAt: {type: string, format: date-time, nullable: true, description: "Incluyente. GET lo calcula; POST puede devolver null."}
        periodEndsAt: {type: string, format: date-time, nullable: true, description: "Excluyente; ONCE no termina. Día local, semana desde lunes o mes calendario."}
        run:
          type: object
          allOf: [{$ref: "#/components/schemas/ChecklistAssignedRun"}]
          nullable: true
          description: Revisión iniciada en el período consultado, o null.
    ChecklistAssignmentEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/ChecklistAssignment"}
    ChecklistRunCreate:
      type: object
      additionalProperties: false
      required: [id, locationId, templateVersionId, clientOperationId, clientCreatedAt]
      properties:
        id: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        templateVersionId: {type: string, format: uuid}
        clientOperationId: {type: string, format: uuid}
        clientCreatedAt: {type: string, format: date-time}
        assignmentId: {type: string, description: "UUID de programación o vacío para revisión sin programación activa."}
    ChecklistRunSummary:
      type: object
      additionalProperties: false
      required: [id, templateName, locationId, locationName, performedBy, performedByName, status, createdAt, answerCount, questionCount]
      properties:
        id: {type: string, format: uuid}
        templateName: {type: string}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        performedBy: {type: string}
        performedByName: {type: string}
        status: {type: string, enum: [DRAFT, SUBMITTED]}
        createdAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time, nullable: true}
        compliancePercent: {type: number, minimum: 0, maximum: 100, nullable: true}
        answerCount: {type: integer, minimum: 0, maximum: 100}
        questionCount: {type: integer, minimum: 1, maximum: 100}
    ChecklistRun:
      type: object
      required: [id, organizationId, locationId, templateVersionId, performedBy, clientOperationId, clientCreatedAt, status, rowVersion, items, answers]
      properties:
        templateName: {type: string}
        locationName: {type: string}
        createdAt: {type: string, format: date-time}
        id: {type: string, format: uuid}
        organizationId: {type: string}
        assignmentId: {type: string, description: "UUID de programación o vacío en revisión libre."}
        locationId: {type: string, format: uuid}
        templateVersionId: {type: string, format: uuid}
        performedBy: {type: string}
        clientOperationId: {type: string, format: uuid}
        clientCreatedAt: {type: string, format: date-time}
        status: {type: string, enum: [DRAFT, SUBMITTED, CANCELLED]}
        rowVersion: {type: integer}
        compliancePercent: {type: number, nullable: true}
        submittedAt: {type: string, format: date-time, nullable: true}
        items:
          type: array
          items: {$ref: "#/components/schemas/ChecklistItem"}
        answers:
          type: array
          items: {$ref: "#/components/schemas/ChecklistAnswer"}
    WorkspaceOrganization:
      type: object
      additionalProperties: false
      required: [id, legalName, businessType]
      properties:
        id: {type: string, format: uuid}
        legalName: {type: string, minLength: 2, maxLength: 200}
        tradeName: {type: string, maxLength: 200}
        taxId: {type: string, maxLength: 20}
        businessType: {type: string, enum: [RESTAURANT, CAFETERIA, CATERING, RELATED_SERVICE]}
        contactName: {type: string, maxLength: 160, description: "Nombre personal opcional: letras, diacríticos, espacios, apóstrofos y guiones; sin números."}
        contactPhone: {type: string, maxLength: 30, description: "Opcional. De 7 a 15 dígitos; permite + inicial, espacios, guiones y paréntesis."}
        contactEmail: {type: string, maxLength: 320, description: "Opcional. Correo completo con dominio con punto, sin controles; hasta 320 bytes."}
    WorkspaceLocation:
      type: object
      additionalProperties: false
      required: [id, name, address]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 2, maxLength: 160}
        address: {type: string, minLength: 3, maxLength: 300}
        district: {type: string, maxLength: 120}
        contactPhone: {type: string, maxLength: 30, description: "Opcional. De 7 a 15 dígitos; permite + inicial, espacios, guiones y paréntesis."}
        timezone: {type: string, readOnly: true, example: America/Lima}
    WorkspaceMember:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [ADMIN, CHEF, WORKER]}
        locationIds:
          type: array
          items: {type: string, format: uuid}
    WorkspaceEntry:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        detail: {type: string}
        status: {type: string}
    Workspace:
      type: object
      properties:
        nextPageTokens:
          type: object
          description: Cursores independientes para locations, members, courses, checklist-summaries e incidents.
          additionalProperties: {type: string, maxLength: 2048}
        totals:
          type: object
          readOnly: true
          properties:
            locations: {type: integer, minimum: 0}
            courses: {type: integer, minimum: 0}
            checklists: {type: integer, minimum: 0}
        organization: {$ref: "#/components/schemas/WorkspaceOrganization"}
        role: {type: string, enum: [SUPER_ADMIN, ADMIN, CHEF, WORKER]}
        locations:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceLocation"}
        members:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceMember"}
        courses:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceEntry"}
        checklists:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceEntry"}
        incidents:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceEntry"}
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: SHA del commit desplegado o versión configurada.
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready
    APIInfoResponse:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: bpm-api
        version:
          type: string
    ProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      required: [id, email, displayName, platformRole, organizations]
      properties:
        id:
          type: string
          description: UID verificado de Firebase.
        email:
          type: string
          format: email
        displayName:
          type: string
        phoneNumber:
          type: string
        platformRole:
          type: string
          enum: [USER, SUPER_ADMIN]
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    OrganizationMembership:
      type: object
      required: [id, legalName, role, locations]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        tradeName:
          type: string
        role:
          type: string
          enum: [ADMIN, CHEF, WORKER]
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    Location:
      type: object
      required: [id, name, address, timezone]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        addressReference:
          type: string
        district:
          type: string
        province:
          type: string
        department:
          type: string
        timezone:
          type: string
          example: America/Lima
    ErrorResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/APIError"
        requestId:
          type: string
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: UNAUTHENTICATED
        message:
          type: string
          example: Se requiere autenticación.
        fields:
          type: object
          additionalProperties:
            type: string
